[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winfix-ai"
version = "1.1.0"
description = "AI-powered Windows troubleshooting and remediation agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "psutil>=5.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "PySide6-Essentials>=6.6",
    "httpx>=0.26",
]

[project.optional-dependencies]
# Pillow is only needed to regenerate the app icon (scripts/generate_icon.py);
# the generated assets are committed, so runtime and CI builds don't need it.
dev = ["pytest>=8.0", "pyinstaller>=6.0", "Pillow>=10.0"]

[project.scripts]
winfix = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
