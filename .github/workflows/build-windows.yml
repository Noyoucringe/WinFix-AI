name: Build Windows executable

# Builds WinFixAI.exe on a real Windows runner with the same script used
# locally (scripts/build.py): tests, PyInstaller build, content and secret
# checks, then launches the packaged exe for its self-test.
#
# - push / PR / manual run  -> exe, zip, checksums and reports are uploaded as
#                              a build artifact
# - pushing a tag like v1.0.0 -> they are also attached to a GitHub Release
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # required to create the release and upload the asset

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10" "pefile>=2023.2.7"

      - name: Build, test and self-test
        env:
          WINFIX_GIT_COMMIT: ${{ github.sha }}
        run: python scripts/build.py

      - name: Show reports
        if: always()
        shell: pwsh
        run: |
          foreach ($f in "dist/build_report.txt", "dist/test_report.txt") {
            if (Test-Path $f) { Write-Host "===== $f ====="; Get-Content $f }
          }

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinFixAI-${{ github.sha }}
          path: |
            dist/WinFixAI.exe
            dist/WinFixAI.zip
            dist/WinFixAI.sha256
            dist/build_report.txt
            dist/test_report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload self-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinFixAI-self-test-screenshots-${{ github.sha }}
          path: build/self_test/
          if-no-files-found: ignore
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinFixAI.zip
            dist/WinFixAI.exe
            dist/WinFixAI.sha256
          generate_release_notes: true
          body: |
            ## WinFix AI ${{ github.ref_name }}

            Download **WinFixAI.zip** (or **WinFixAI.exe**) below and run it. No
            installation or Python needed. Windows 10 1809+ or Windows 11, 64-bit.

            Verify the download: `Get-FileHash WinFixAI.exe -Algorithm SHA256` must
            match **WinFixAI.sha256**.

            Windows SmartScreen may warn that the publisher is unknown because the
            binary is not code-signed. Choose **More info -> Run anyway** if you
            trust this build.

            WinFix runs read-only diagnostics and never changes anything without
            your explicit approval.
