name: Build Windows executable

# Builds WinFix.exe on a real Windows runner (PyInstaller cannot cross-compile).
#
# - push / PR / manual run  -> the .exe is uploaded as a build artifact
# - pushing a tag like v1.1.0 -> the .exe is also attached to a GitHub Release
#   so anyone can download it without a GitHub account.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # required to create the release and upload the asset

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build WinFix.exe
        run: pyinstaller winfix.spec --noconfirm --clean

      - name: Verify the executable was produced
        shell: pwsh
        run: |
          if (-not (Test-Path dist/WinFix.exe)) {
            Write-Error "dist/WinFix.exe was not produced"
            exit 1
          }
          $size = (Get-Item dist/WinFix.exe).Length / 1MB
          Write-Host ("Built WinFix.exe ({0:N1} MB)" -f $size)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinFix-exe
          path: dist/WinFix.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WinFix.exe
          generate_release_notes: true
          body: |
            ## WinFix AI ${{ github.ref_name }}

            Download **WinFix.exe** below and run it — no Python installation needed.

            Windows SmartScreen may warn that the publisher is unknown because the
            binary is not code-signed. Choose **More info -> Run anyway** if you
            trust this build.

            WinFix runs read-only diagnostics and never changes anything without
            your explicit approval.
